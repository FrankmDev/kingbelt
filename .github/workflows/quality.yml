name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Scan repository and Git history for secrets
        run: bun run security:scan:history

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run audit:dependencies

      - name: Check Astro and TypeScript
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Build static site
        run: bun run build

      - name: Scan generated browser artifacts
        run: bun run security:scan

      - name: Check internal links
        run: bun run check:links

      - name: Check performance budgets
        run: bun run check:perf
